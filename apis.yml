aid: pathalys-pharma
name: Pathalys Pharma
description: >-
  Pathalys Pharma, Inc. is a private, late-stage clinical biopharmaceutical company headquartered at
  4000 Center at North Hills Street, Raleigh, North Carolina, in the Research Triangle Park region.
  It was created with initial funding from Catalys Pacific and the DaVita Venture Group to be a
  multi-asset biopharmaceutical company focused on the needs of patients with end-stage kidney
  disease, and it develops advanced therapeutics addressing unmet needs in the management of
  late-stage chronic kidney disease (CKD). Its lead asset is upacicalcet, a novel non-peptide
  calcimimetic delivered intravenously by pre-filled syringe at the end of a hemodialysis session
  for the treatment of secondary hyperparathyroidism (SHPT) in patients with end-stage kidney
  disease on hemodialysis; it is an investigational product candidate in the United States, subject
  to FDA review. Pathalys raised $150 million in secured product financing and equity led by
  Abingworth in January 2023 alongside a development collaboration with Launch Therapeutics to run
  the pivotal PATH Phase 3 program, and closed an oversubscribed $105 million Series B in August
  2024 to fund NDA submission and pre-commercialization. Pathalys runs no developer program and
  publishes no product API; the only machine-readable surface it exposes is the anonymously readable
  WordPress REST content API behind pathalys.com, which serves the corporate site, the news and
  scientific-updates stream, and the media library.
