  scheme: path-namespace
  current: wp/v2
  namespaces_registered: 20
  publicly_usable_namespaces: [wp/v2, oembed/1.0]
  provider_policy: none-published
  note: >-
    wp/v2 has been the stable WordPress REST namespace since WordPress 4.7 (2016). Version changes
    would arrive with a WordPress core upgrade, on WordPress's schedule, not Pathalys's.
deprecation:
