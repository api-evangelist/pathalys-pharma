summary: >-
  Pathalys Pharma publishes no API lifecycle policy of any kind, because it publishes no API program.
  The lifecycle facts below belong to the WordPress REST API the corporate site happens to expose,
  and are properties of WordPress core rather than commitments Pathalys has made.
